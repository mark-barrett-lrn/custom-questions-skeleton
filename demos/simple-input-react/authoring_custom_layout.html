<div class="lrn-qe-edit-form">
  <span data-lrn-qe-label="stimulus"></span>
  <span data-lrn-qe-input="stimulus" class="lrn-qe-ckeditor-lg"></span>

  <div class="lrn-qe-form-group-wrapper">
    <div class="lrn-qe-form-group">
      <label class="lrn-qe-label">Test Cases</label>
      <div class="lrn-qe-form-control">
        <div data-lrn-qe-loop="test_cases[*]">
          <div class="row">
            <div class="col-xs-6">
              <label class="lrn-qe-label">Input</label>
              <span data-lrn-qe-input="test_cases[*].input"></span>
            </div>

            <div class="col-xs-5">
              <label class="lrn-qe-label">Output (Expected Result)</label>
              <span data-lrn-qe-input="test_cases[*].output"></span>
            </div>

            <div class="col-xs-1">
              <button
                type="button"
                class="btn btn-default"
                data-lrn-qe-action-remove="test_cases[*]"
              >
                <span class="ls-icon ls-delete"></span>
              </button>
            </div>
          </div>

          <hr class="lrn-qe-section-divider" />
        </div>

        <button
          type="button"
          class="btn btn-primary"
          data-lrn-qe-action-add="test_cases"
        >
          Add New Test Case
        </button>
      </div>
    </div>
  </div>

  <!-- Validation -->
  <span
    data-lrn-qe-label="valid_response"
    data-lrn-qe-heading="4"
    data-lrn-qe-section="validation.heading"
    class="lrn-qe-h4 lrn-qe-section-header lrn-qe-text-bold lrn-qe-border-none"
  ></span>
  <div
    class="lrn-qe-tabs"
    data-lrn-qe-tabs
    data-lrn-qe-section="valid_response.content"
  >
    <div class="lrn-qe-tab-item" data-lrn-qe-tab-item>
      <div class="lrn-qe-tab-sub-content">
        <span
          data-lrn-qe-input="valid_response.score"
          class="lrn-qe-inline-block lrn-qe-text-left lrn-qe-form-control-xs lrn-qe-margin-left-sm"
        ></span>
        <span
          data-lrn-qe-label="valid_response.score"
          class="lrn-qe-inline-block lrn-qe-margin-left-sm"
        ></span>
      </div>
      <div
        class="lrn-qe-padding-left-sm lrn-qe-padding-right-sm lrn-qe-padding-bottom-xs"
      >
        <span data-lrn-qe-label="valid_response.value"></span>
        <span data-lrn-qe-input="valid_response.value"></span>
      </div>
    </div>
  </div>

  <!-- more options -->
  <h4 class="lrn-qe-heading" data-lrn-qe-adv-toggle>
    <button
      type="button"
      class="lrn-qe-form-label lrn-qe-margin-top-none lrn-qe-more-options"
      data-lrn-qe-section="more_options.heading"
    >
      <span
        class="lrn-qe-i-arrow lrn-qe-inline-block"
        data-lrn-qe-section="more_options.toggle"
      ></span>
      <span class="lrn-qe-inline-block lrn-qe-text-bold">
        <label
          class="lrn-qe-label lrn-qe-form-label-name"
          data-lrn-qe-i18n-label="heading.moreOptions"
          value="More options"
        ></label>
      </span>
    </button>
  </h4>
  <div data-lrn-qe-adv-content data-lrn-qe-section="more_options.content">
    <div class="lrn-qe-row-flex" data-lrn-qe-layout-wrapper>
      <div class="lrn-qe-col-xs-12 lrn-qe-col-sm-6">
        <span
          data-lrn-qe-input="instant_feedback"
          class="lrn-qe-inline-block"
        ></span>
        <span
          data-lrn-qe-label="instant_feedback"
          class="lrn-qe-inline-block"
        ></span>
      </div>
    </div>
  </div>
</div>
